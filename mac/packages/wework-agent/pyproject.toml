[project]
name = "wework-agent"
version = "0.1.0"
description = "WeCom Automation Agent"
dependencies = [
    "ax-core",
]
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
ax-core = { workspace = true }

[project.scripts]
send-wework = "wework_agent.cli:main"
